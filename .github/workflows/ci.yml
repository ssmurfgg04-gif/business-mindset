name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest uv

      - name: Run skill health check
        run: python scripts/skill_health.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify skill loads
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from scripts.skill_health import check_frontmatter, check_schema_validity
          fm = check_frontmatter()
          assert all(k in fm for k in ['name','version','description','license','compatibility','author','repository','tags'])
          assert check_schema_validity()
          print('Skill validation passed')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Check code style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .