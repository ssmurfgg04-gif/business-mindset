[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-mindset"
version = "2.1.0"
description = "Rigorous business opportunity analysis with real-world validation, asymmetric execution scoring, market reality checks, and multi-persona cognitive auditing."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ssmurfgg04-gif", email = ""}
]
keywords = ["business", "entrepreneurship", "strategy", "decision-making", "cognitive-frameworks", "asymmetric-execution", "exponential-potential", "calibration", "decision-journal", "mental-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "uv>=0.1.0",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["business_mindset*"]
exclude = ["tests*", "benchmarks*", "scripts*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - allow longer lines for documentation
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4

[tool.uv]
compile-bytecode = true